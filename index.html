<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>legalautomation.io</title>
<style>
  :root{
    --paper:#f6f2ea; --card:#fffdf8; --ink:#1b2333; --soft:#5a6478;
    --brass:#a67c2e; --chip:#efe3c6; --chip-ink:#6b4d14; --rule:#d8cfbd; --dot:rgba(27,35,51,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#131823; --card:#1b2230; --ink:#ece6da; --soft:#9aa3b5;
      --brass:#d4aa5c; --chip:#3a3222; --chip-ink:#e8c98a; --rule:#2c3445; --dot:rgba(236,230,218,.06);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
    background:var(--paper) radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0/22px 22px;
    color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:600px; text-align:center}

  .mark{font:600 clamp(28px,6vw,42px)/1.1 Georgia,"Times New Roman",serif; letter-spacing:-.01em}
  .mark span{color:var(--brass)}
  .rule{width:48px; height:2px; background:var(--brass); margin:18px auto 0}

  .doc{
    margin:34px 0 30px; text-align:left; background:var(--card); border:1px solid var(--rule); border-radius:8px;
    padding:28px 26px 20px; font:17px/2 Georgia,"Times New Roman",serif;
    box-shadow:0 24px 48px -28px rgba(0,0,0,.35); position:relative;
  }
  .doc .tag{
    position:absolute; top:-12px; left:20px; background:var(--ink); color:var(--paper);
    font:600 11px/1 system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; padding:6px 10px; border-radius:3px;
  }
  .doc p + p{margin-top:10px}

  .v{
    font:13.5px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    background:var(--chip); color:var(--chip-ink); padding:3px 7px; border-radius:4px; white-space:nowrap;
    transition:background .35s, color .35s;
  }
  .v.filled{
    font:inherit; background:transparent; color:var(--ink); padding:0 1px; border-radius:0;
    box-shadow:inset 0 -1.5px 0 var(--brass);
  }
  .v.active::after{
    content:""; display:inline-block; width:2px; height:1.05em; margin-left:2px; vertical-align:-.15em;
    background:var(--brass); animation:blink .8s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .status{
    display:flex; align-items:center; gap:12px; margin-top:18px; padding-top:14px; border-top:1px dashed var(--rule);
    font:13px/1.4 system-ui,sans-serif; color:var(--soft);
  }
  .bar{flex:1; height:4px; background:var(--rule); border-radius:2px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--brass); transition:width .35s ease}
  .label{min-width:9.5em; text-align:right}
  .label.done{color:var(--brass); font-weight:600}

  .soon{font:500 15px/1.5 system-ui,sans-serif; color:var(--soft)}
  .soon b{color:var(--ink); font-weight:600}

  @media (max-width:480px){
    .doc{padding:26px 18px 18px; font-size:16px}
    .label{min-width:auto}
  }
</style>
</head>
<body>
<main>
  <div class="mark">legal<span>automation</span>.io</div>
  <div class="rule"></div>

  <div class="doc" aria-hidden="true">
    <span class="tag">Assembling</span>
    <p>This Agreement is made on <span class="v" data-k="Date"></span> between
      <span class="v" data-k="Client"></span> and <span class="v" data-k="Counterparty"></span>,
      and is governed by the laws of <span class="v" data-k="State"></span>.</p>
    <p>Payment of <span class="v" data-k="Amount"></span> is due within
      <span class="v" data-k="Days"></span> days of signing.</p>
    <div class="status">
      <div class="bar"><i id="bar"></i></div>
      <span class="label" id="label">0 of 6 fields</span>
    </div>
  </div>

  <p class="soon"><b>Something is being assembled.</b> Check back soon.</p>
</main>

<script>
(() => {
  const sets = [
    {Date:"January 12, 2027", Client:"Alder & Finch LLP", Counterparty:"M. Okafor", State:"Maine", Amount:"$4,800", Days:"30"},
    {Date:"March 3, 2027", Client:"Mapleview Clinic", Counterparty:"Harborline Freight", State:"Vermont", Amount:"$12,250", Days:"45"},
    {Date:"June 18, 2027", Client:"Lakeshore Partners", Counterparty:"Q. Tran", State:"Oregon", Amount:"$975", Days:"15"}
  ];
  const vars = [...document.querySelectorAll(".v")];
  const bar = document.getElementById("bar");
  const label = document.getElementById("label");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const setProgress = n => {
    bar.style.width = (n / vars.length * 100) + "%";
    const done = n === vars.length;
    label.textContent = done ? "Document assembled" : n + " of " + vars.length + " fields";
    label.classList.toggle("done", done);
  };
  const reset = () => {
    vars.forEach(v => { v.textContent = "«" + v.dataset.k + "»"; v.classList.remove("filled", "active"); });
    setProgress(0);
  };

  if (reduce) {
    vars.forEach(v => { v.textContent = sets[0][v.dataset.k]; v.classList.add("filled"); });
    setProgress(vars.length);
    return;
  }

  (async () => {
    let i = 0;
    for (;;) {
      const s = sets[i % sets.length];
      reset();
      await sleep(1100);
      for (let n = 0; n < vars.length; n++) {
        const v = vars[n];
        v.classList.add("filled", "active");
        v.textContent = "";
        for (const ch of s[v.dataset.k]) { v.textContent += ch; await sleep(55); }
        v.classList.remove("active");
        setProgress(n + 1);
        await sleep(280);
      }
      await sleep(3400);
      i++;
    }
  })();
})();
</script>
</body>
</html>
